<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>projects · ion iapără</title>
  <meta name="description" content="Side projects Ion Iapără is building. Open to collaborators." />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- nav -->
  <nav>
    <a href="/" class="nav-logo">ion</a>
    <ul class="nav-links">
      <li><a href="log.html">log</a></li>
      <li><a href="projects.html" aria-current="page">projects</a></li>
      <li><a href="writing.html">writing</a></li>
      <li><a href="now.html">now</a></li>
    </ul>
  </nav>

  <!-- main -->
  <main class="fade-in">

    <header class="page-header">
      <h1>projects</h1>
      <p class="page-desc">things i'm building. if something interests you, <a href="mailto:iapara.ion.g@gmail.com">reach out</a>.</p>
    </header>

    <!-- project list -->
    <div class="project-list">

    </div>

  </main>

  <!-- footer -->
  <footer>
    <div class="footer-left">
      <span>ion iapără · berlin · open to collab</span>
    </div>
    <ul class="footer-links">
      <li><a href="mailto:iapara.ion.g@gmail.com" aria-label="email">email</a></li>
      <li><a href="https://www.linkedin.com/in/ion-iapara/" target="_blank" rel="noopener" aria-label="LinkedIn">linkedin</a></li>
      <li><a href="https://github.com/ioonp" target="_blank" rel="noopener" aria-label="GitHub">github</a></li>
    </ul>
  </footer>

  <style>
    .page-header {
      padding: 2rem 0 1.5rem;
    }

    .page-header h1 {
      font-family: var(--font-hero);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0;
    }

    .page-desc a {
      color: var(--text);
    }

    /* project cards */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .project-card {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .project-card:first-child {
      border-top: 1px solid var(--border);
    }

    .project-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }

    .project-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .project-desc {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
      max-width: 520px;
    }

    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .project-looking-for {
      font-size: 0.78rem;
    }

    .empty-state {
      font-size: 0.85rem;
      padding: 1rem 0;
    }

    .project-type {
      font-size: 0.78rem;
    }

    .project-title a {
      text-decoration: none;
    }

    .project-title a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--muted);
    }

    .project-impact {
      font-size: 0.78rem;
    }

    /* status pills */
    .project-status-pill {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      padding: 0.15em 0.55em;
      border-radius: 999px;
    }

    .status-active     { background: #dcfce7; color: #15803d; }
    .status-parked     { background: #fef9c3; color: #a16207; }
    .status-deprecated { background: #f4f4f5; color: #a0a09c; }
  </style>

  <script src="data.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
